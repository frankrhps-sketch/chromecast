<!DOCTYPE html>
<html>
<head>
  <style>
    /* Ensure the player fills the entire TV screen */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
    cast-media-player { width: 100%; height: 100%; }
  </style>
  <script src="https://www.gstatic.com"></script>
</head>
<body>
  <!-- This tag MUST be present for the screen to show anything but black -->
  <cast-media-player></cast-media-player>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // Step 9: Intercept the LOAD request
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      loadRequestData => {
        return fetch('https://storage.googleapis.com')
          .then(response => response.json())
          .then(data => {
            const contentId = loadRequestData.media.contentId;
            const videoList = data.categories[0].videos; // Step 9 JSON structure
            const item = videoList.find(v => v.title === contentId);

            if (item) {
              loadRequestData.media.contentUrl = item.sources[0]; // Take first URL string
              loadRequestData.media.contentType = 'video/mp4';
            } else {
              // Forced fallback so it doesn't stay blank
              loadRequestData.media.contentUrl = 'https://commondatastorage.googleapis.com';
              loadRequestData.media.contentType = 'video/mp4';
            }
            return loadRequestData;
          })
          .catch(() => {
            return loadRequestData; // Return original if fetch fails
          });
      }
    );

    // Initialize the receiver
    context.start();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: blue !important; }
    cast-media-player { width: 100%; height: 100%; }
  </style>
  <script src="https://www.gstatic.com"></script>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // No API calls, no logic—just force a video to play
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        request.media.contentUrl = 'https://commondatastorage.googleapis.com';
        request.media.contentType = 'video/mp4';
        return request;
      }
    );

    context.start();
  </script>
</body>
</html>

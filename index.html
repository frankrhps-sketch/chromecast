<!DOCTYPE html>
<html>
<head>
  <style>
    /* FIX 1: Ensure the player is visible and fills the TV screen */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; }
    cast-media-player { width: 100%; height: 100%; display: block; }
  </style>
  <script src="https://www.gstatic.com"></script>
</head>
<body>
  <cast-media-player></cast-media-player>
  
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      loadRequestData => {
        return fetch('https://storage.googleapis.com')
          .then(response => response.json())
          .then(data => {
            const contentId = loadRequestData.media.contentId;
            const videoList = data.categories[0].videos; // FIX 2: Corrected JSON path
            const item = videoList.find(v => v.title === contentId);

            if (item) {
              // FIX 3: item.sources is an array; CAF requires a single string
              loadRequestData.media.contentUrl = item.sources[0];
              loadRequestData.media.contentType = 'video/mp4';
            }
            return loadRequestData;
          })
          .catch(() => loadRequestData); // Fallback to original request
      }
    );

    context.start();
  </script>
</body>
</html>
